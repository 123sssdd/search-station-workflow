# 情报站集中配置示例（station config）。复制为 config.yaml 后按实例修改；不写任何密钥值，只写环境变量名。
version: "2.1"            # 对应现行指令版本；v3 为草案未生效
timezone: Asia/Shanghai   # UTC+8
user_language: zh         # 面向用户的消息语言
workspace: <WORKSPACE>    # 共享工作目录，如 /workspace/learning-loop

schedule:
  night_window: "00:00-10:00"         # 用户休息；夜间只做 A 类
  night_class_A: [搜索, 规划, 设计, 沉淀草稿, 整理, 复核, Todos写Todos库, Memory写工作记录与Decisions草稿, 删除自己当日一次性定时任务]
  night_class_B: [关键决策, 登录失效或扫码, 凭据或付费, 对外发消息, 推送manifest, 同步Notion轮次与沉淀库, 改bot指令或配置, 其他删除]
  daily_meeting: "00:00"
  meeting_wait_minutes: 15
  fallback_routine: "00:40"           # 每个 bot 常驻兜底
  checklist_review_rounds_max: 3
  checklist_review_wait_minutes: 15
  checklist_finalize_deadline: "01:30"

rotation:
  odd: coordinator_a                   # = brainstorm-01
  even: coordinator_b                  # = brainstorm-02
  lock_dir: rounds/
  lock_expiry_hours: 6
  review_timeout_minutes: 30          # 超时发用户并标「未经复核」
  deputy_takeover_minutes: 30         # 01 无响应由 02 代主持/代拍板

roles:                                # 启用/停用/改名；agent_id 填你平台上的 id
  brainstorm-01: { enabled: true, template: templates/bots/brainstorm-01.md, agent_id: <AGENT_ID_01> }
  brainstorm-02: { enabled: true, template: templates/bots/brainstorm-02.md, agent_id: <AGENT_ID_02> }
  searcher:      { enabled: true, template: templates/bots/searcher.md,      agent_id: <AGENT_ID_SEARCHER> }
  quality-eval:  { enabled: true, template: templates/bots/quality-eval.md,  agent_id: <AGENT_ID_EVAL> }
  memory:        { enabled: true, template: templates/bots/memory.md,        agent_id: <AGENT_ID_MEMORY> }
  optimizer:     { enabled: true, template: templates/bots/optimizer.md,     agent_id: <AGENT_ID_OPTIMIZER> }   # 可选
  diagram:       { enabled: true, template: templates/bots/diagram.md,       agent_id: <AGENT_ID_DIAGRAM> }     # 可选
  todos:         { enabled: true, template: templates/bots/todos.md,         agent_id: <AGENT_ID_TODOS> }       # 可选

evidence:
  files: [plan, search, eval]
  dir: rounds/
  require_user_quote_for_push: true

search_plan:                          # v2.1
  standards_cache: standards/<domain>.md
  standards_cache_days: 30
  standards_min_sources_per_dimension: 2
  plan_card_wait_minutes: 10
  tiers:
    A: { raw: [100, 200], dedup_min: 60, keyword_groups_min: 30, picked: [10, 20], minutes: [45, 180] }
    B: { dedup_min: 20, keyword_groups_min: 15, minutes_max: 90 }
    C: { independent_sources_min: 2, minutes_max: 30 }
  single_source_max_ratio: 0.40
  keyword_execution_rate_min: 0.90
  saturation: { last_groups: 5, new_ratio_below: 0.10 }
  eval:
    score_scale: 5
    pass_avg_min: 4.0
    pass_dim_min: 3
    deep_eval: [5, 8]
    spot_check_ratio: 0.10
    spot_check_min: 3
  xhs_limits: { posts_per_round_max: 20, comments_per_post_max: 10, skip_comments_at_night: true }

search:
  chain_file: config/backends.yaml

storage:
  source_of_truth: manifest.json      # Sketchmind 仓库根目录，仅 Memory 写
  mirror: notion                      # notion | obsidian | local-md | none
  notion:
    hub_url_env: NOTION_HUB_URL       # 可选：把页面链接放环境变量而非入库
    write_rate_per_sec_max: 3
    sole_writers: { todos_db: todos, other_dbs: memory }
tasks:                                # 任务库不由 manifest 派生
  adapter: notion                     # notion | local-sqlite
  backup: local-sqlite                # todo-management，路径取环境变量 TODO_DB
  sole_writer: todos
  dashboard:
    repo: <SKETCHMIND_REPO>
    pages_url: <SKETCHMIND_PAGES_URL>

secrets_env:                          # 只列变量名
  - FIRECRAWL_API_KEY
  - SEARXNG_SECRET
non_secret_env:
  - TODO_DB
  - SEARXNG_URL
  - RSSHUB_URL
